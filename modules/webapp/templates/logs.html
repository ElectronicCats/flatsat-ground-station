{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<h1>System Logs</h1>
<table>
    <tr><th>Timestamp</th><th>Level</th><th>Source</th><th>Message</th></tr>
    {% for log in logs %}
    <tr>
        <td>{{ log.timestamp }}</td>
        <td>{{ log.level }}</td>
        <td>{{ log.source }}</td>
        <td>{{ log.message | safe }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
