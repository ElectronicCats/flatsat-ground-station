[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flatsat-ground-station"
dynamic = ["version"]
description = "FlatSat Host Ground Station CLI & Core toolkit"
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.9"
authors = [
    { name = "Electronic Cats", email = "support@electroniccats.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "click>=8.0.0",
    "pycryptodome>=3.20.0",
    "pyserial>=3.5",
    "rich>=14.0.0",
    "requests>=2.31.0",
    "Flask>=3.0.3",
    "Flask-SocketIO>=5.3.7",
    "simple-websocket>=1.1.0",
    "pyudev>=0.24.4; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-flask>=1.3.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/ElectronicCats/flat-sat-fw-interno"
Repository = "https://github.com/ElectronicCats/flat-sat-fw-interno"

[project.scripts]
flatsat = "cli.app:main"

[tool.setuptools]
py-modules = ["flatsat_cli"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["cli*", "core*", "webapp*", "db*"]

[tool.setuptools.package-data]
webapp = ["templates/**/*", "static/**/*"]
